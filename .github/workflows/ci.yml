name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    name: Testes (banco + webhook) e build do frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Testes (PGlite)
        run: |
          npm ci
          npm test

      - name: Build do frontend
        working-directory: web
        run: |
          npm ci
          npm run build
